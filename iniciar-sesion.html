<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio de sesion</title>

    <link rel="stylesheet" href="style.css">
</head>
    <style>
        form{
            display: flex;
            flex-direction: column;
            width: 30vw;
            gap: 20px;
            border-width: 2px;
            border-style: solid;
            border-image: none;
            padding: 20px;
            border-radius: 10px;
        }

    </style>
<body>
    <main>
        <h1>Iniciar Sesión</h1>
        <form action="procesar_sesion" method="POST">
            <label for="username">Nombre de usuario:</label>
            <input type="name" id="username" name="username" required placeholder="Ingresa tu nombre de usuario">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">


            <input type="submit" value="Iniciar Sesión">
            
            <li><a href="recuperacion.html">olvidaste la contraseña?</a></li>
        </form>
    </main>
</body>
</html>
